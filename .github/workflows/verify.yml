name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew --stacktrace verifyCi
      - run: git diff --check
      # The wiki is built from the Markdown (wiki.yml); a relative link to a
      # file that does not exist would be a 404 there, so it fails here.
      - run: python3 scripts/sync-wiki.py --repo "$GITHUB_REPOSITORY" --check
